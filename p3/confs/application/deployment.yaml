apiVersion: apps/v1
kind: Deployment
metadata:
  name: playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playground
  template:
    metadata:
      labels:
        app: playground
   spec:
     containers:
      - name: playground
        image: will42/playground:v1
        ports:
          - containerPorts: 8888
