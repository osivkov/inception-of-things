apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground
  namespace: argocd
spec:
  project: default


  source:
    repoURL: https://github.com/osivkov/inception-of-things.git
    targetRevision: main
    path: p3/confs/application


  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
