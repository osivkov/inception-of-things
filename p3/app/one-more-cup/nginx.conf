server {
    listen 0.0.0.0:8888;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Explicit type for ES modules, including on base images without .mjs in mime.types.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    # This is a single page with no client-side router. Unknown paths return a real 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
