apiVersion: v1
kind: ConfigMap
metadata:
  name: app2-page
data:
  index.html: |
    <!doctype html>
    <html>
      <body style="font-family: sans-serif; background: #fef3c7; padding: 50px;">
        <h1>Hello from app2</h1>
        <p><b>Pod:</b> $POD_NAME</p>
        <p><b>Node:</b> $NODE_NAME</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/sh", "-c"]
          args:
            - envsubst '$POD_NAME $NODE_NAME' < /tmp/index.html > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'
          volumeMounts:
            - name: page
              mountPath: /tmp/index.html
              subPath: index.html
      volumes:
        - name: page
          configMap:
            name: app2-page
---

apiVersion: v1
kind: Service

metadata:
  name: app2

spec:
  type: ClusterIP

  selector:
    app: app2

  ports:
    - port: 80
      targetPort: 80
