apiVersion: v1
kind: ConfigMap
metadata:
  name: app3-page
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>App 3</title>
      </head>
      <body style="font-family: sans-serif; background: #dcfce7; padding: 50px;">
        <h1>Hello from app3</h1>
        <p>Inception-of-Things · Default application 3</p>
        <p><b>Pod:</b> $POD_NAME</p>
        <p><b>Node:</b> $NODE_NAME</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app3
  template:
    metadata:
      labels:
        app: app3
    spec:
      containers:
        - name: app3
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/sh", "-c"]
          args:
            - envsubst '$POD_NAME $NODE_NAME' < /tmp/index.html > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'
          volumeMounts:
            - name: page
              mountPath: /tmp/index.html
              subPath: index.html
      volumes:
        - name: page
          configMap:
            name: app3-page
---
apiVersion: v1
kind: Service
metadata:
  name: app3
spec:
  type: ClusterIP
  selector:
    app: app3
  ports:
    - port: 80
      targetPort: 80
