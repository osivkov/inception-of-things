apiVersion: v1
kind: ConfigMap
metadata:
  name: app1-page
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>App 1</title>
      </head>
      <body style="font-family: sans-serif; background: #e0f2fe; padding: 50px;">
        <h1>Hello from app1</h1>
        <p>Inception-of-Things · Kubernetes application 1</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: app1

spec:
  replicas: 1

  selector:
    matchLabels:
      app: app1


  template:
    metadata:
      labels:
        app: app1


    spec:
      containers:
        - name: app1
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true

      volumes:
       - name: page
         configMap:
           name: app1-page
---

apiVersion: v1
kind: Service

metadata:
  name: app1

spec:
  type: ClusterIP

  selector:
    app: app1

  ports:
    - port: 80
      targetPort: 80
