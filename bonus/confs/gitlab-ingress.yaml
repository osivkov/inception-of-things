apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab
  namespace: gitlab
spec:
  ingressClassName: traefik
  rules:
     - host: gitlab.local
       http:
         paths:
           - path: /
             pathType: Prefix
             backend:
               service:
                 name: gitlab
                 port:
                   number: 80
