apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground
  namespace: argocd
spec:
  project: default


  source:
    repoURL: http://gitlab.gitlab.svc.cluster.local/osivkov/iot.git
    targetRevision: main
    path: .


  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
